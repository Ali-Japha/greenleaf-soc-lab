title: SQL Injection Pattern Detected
id: 22222222-3333-4444-5555-666666666666
status: experimental
description: Detects standard SQL syntax errors in application inputs indicating injection attempts.
logsource:
    category: web
    product: greenleaf_app
detection:
    selection:
        message|contains:
            - 'syntax error'
            - 'unclosed quotation mark'
            - 'UNION SELECT'
    condition: selection
level: critical
tags:
    - attack.initial_access
    - attack.t1190
